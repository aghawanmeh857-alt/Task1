<!DOCTYPE html>
<html>
<head>
    <title>Cards</title>
    <link rel="stylesheet" href="tsk2.css">
</head>

<body>

    <div class="container">

        <div class="card">
            <h2>Heading</h2>

            <img src="download (1).jpg">

            <p>
                A short description about this card.
            </p>

        </div>


        <div class="card">
            <h2>A short heading</h2>

            <img src="download (2).jpg">

            <p>
                Short content.
            </p>

            <footer>
                I have a footer!
            </footer>
        </div>


        <div class="card">
            <h2>A longer heading in this card</h2>

            <img src="images.webp">
            <p>
                In a curious world, we can learn many interesting things.
            </p>

            <footer>
                I have a footer!
            </footer>
        </div>

    </div>

</body>
</html>
